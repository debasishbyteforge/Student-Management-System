<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 320px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000018;
        }

        h2 {
            text-align: center;
            color: #174a8b;
        }

        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0;
        }

        button {
            background: #174a8b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Student Login</h2>

        <form id="loginForm">
            <input type="email" id="email"
                placeholder="Email address" required>

            <input type="password" id="password"
                placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <p id="message"></p>

        <a href="index.html">Back to Home</a>
    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("message").textContent =
                    "Demo login only. Authentication is not configured yet.";
            });
    </script>

</body>
</html>
