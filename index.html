<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f5f9;
            color: #222;
        }

        header {
            background: #174a8b;
            color: white;
            text-align: center;
            padding: 22px;
        }

        nav {
            background: #123663;
            padding: 14px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        #userInfo {
            color: white;
            margin: 0 10px;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000012;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
        }

        input {
            width: 100%;
        }

        button {
            background: #174a8b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #e5edf8;
        }

        .delete {
            background: #c62828;
        }

        .edit {
            background: #2e7d32;
            margin-right: 5px;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>Student Management System</h1>
    <p>Manage student information easily</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="login.html" id="loginLink">Login</a>
    <a href="register.html">Register</a>
    <span id="userInfo"></span>
    <button type="button" id="logoutButton" hidden>Logout</button>
</nav>

<main>
    <section class="card">
        <h2 id="formHeading">Add Student</h2>

        <form id="studentForm">
            <input type="text" id="name"
                placeholder="Student name" required>

            <input type="text" id="roll"
                placeholder="Roll number" required>

            <input type="email" id="email"
                placeholder="Email address" required>

            <button type="submit">Add Student</button>
        </form>
    </section>

    <section class="card">
        <h2>Student Records</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll Number</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentList"></tbody>
        </table>

        <p id="emptyMessage">No students added yet.</p>
    </section>
</main>

<footer>
    <p>Student Management System | WAD Project</p>
</footer>

<script>
    // STEP 1: Protect the dashboard.
    // Users must log in before accessing student records.

    let loggedInUser = null;

    try {
        loggedInUser = JSON.parse(
            sessionStorage.getItem("loggedInUser") || "null"
        );
    } catch (error) {
        loggedInUser = null;
    }

    if (
        !loggedInUser ||
        typeof loggedInUser !== "object" ||
        !loggedInUser.email
    ) {
        window.location.replace("login.html");
    } else {
        initializeDashboard();
    }

    function initializeDashboard() {
        const logoutButton = document.getElementById("logoutButton");
        const loginLink = document.getElementById("loginLink");
        const userInfo = document.getElementById("userInfo");

        loginLink.hidden = true;
        userInfo.textContent = "Welcome, " + loggedInUser.name + "!";
        logoutButton.hidden = false;

        logoutButton.addEventListener("click", function() {
            sessionStorage.removeItem("loggedInUser");
            window.location.replace("login.html");
        });

        const form = document.getElementById("studentForm");
        const studentList = document.getElementById("studentList");
        const emptyMessage = document.getElementById("emptyMessage");
        const formHeading = document.getElementById("formHeading");
        const submitButton = form.querySelector('button[type="submit"]');

        let students = [];

        try {
            students = JSON.parse(
                localStorage.getItem("students") || "[]"
            );

            if (!Array.isArray(students)) {
                students = [];
            }
        } catch (error) {
            students = [];
        }

        function saveStudents() {
            localStorage.setItem("students", JSON.stringify(students));
        }

        function resetStudentForm() {
            delete form.dataset.editIndex;
            form.reset();
            submitButton.textContent = "Add Student";
            formHeading.textContent = "Add Student";
        }

        function displayStudents() {
            studentList.innerHTML = "";

            students.forEach(function(student, index) {
                const row = document.createElement("tr");

                [student.name, student.roll, student.email].forEach(
                    function(value) {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        row.appendChild(cell);
                    }
                );

                const actionCell = document.createElement("td");

                // Edit student
                const editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.className = "edit";

                editButton.addEventListener("click", function() {
                    document.getElementById("name").value = student.name;
                    document.getElementById("roll").value = student.roll;
                    document.getElementById("email").value = student.email;

                    form.dataset.editIndex = index;
                    submitButton.textContent = "Update Student";
                    formHeading.textContent = "Edit Student";

                    document.getElementById("name").focus();
                });

                // Delete student
                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "delete";

                deleteButton.addEventListener("click", function() {
                    students.splice(index, 1);

                    if (form.dataset.editIndex !== undefined) {
                        resetStudentForm();
                    }

                    saveStudents();
                    displayStudents();
                });

                actionCell.appendChild(editButton);
                actionCell.appendChild(deleteButton);

                row.appendChild(actionCell);
                studentList.appendChild(row);
            });

            emptyMessage.hidden = students.length > 0;
        }

        // Add or update a student
        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const roll = document.getElementById("roll").value.trim();
            const email = document.getElementById("email")
                .value.trim().toLowerCase();

            if (!name || !roll || !email) {
                alert("Please fill in all fields.");
                return;
            }

            const editIndex = form.dataset.editIndex;

            const duplicateRoll = students.some(function(student, index) {
                return student.roll.toLowerCase() === roll.toLowerCase()
                    && index !== Number(editIndex);
            });

            const duplicateEmail = students.some(function(student, index) {
                return student.email.toLowerCase() === email
                    && index !== Number(editIndex);
            });

            if (duplicateRoll) {
                alert("This roll number already exists.");
                return;
            }

            if (duplicateEmail) {
                alert("This email address already exists.");
                return;
            }

            if (editIndex !== undefined) {
                students[Number(editIndex)] = { name, roll, email };
            } else {
                students.push({ name, roll, email });
            }

            saveStudents();
            resetStudentForm();
            displayStudents();
        });

        displayStudents();
    }
</script>

</body>
</html>
