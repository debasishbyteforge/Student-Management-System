<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f5f9;
            color: #222;
        }

        header {
            background: #174a8b;
            color: white;
            text-align: center;
            padding: 22px;
        }

        nav {
            background: #123663;
            padding: 14px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000012;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
        }

        input {
            width: 100%;
        }

        button {
            background: #174a8b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #e5edf8;
        }

        .delete {
            background: #c62828;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: #555;
        }
        #userinfo {
            color: white !important;
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage student information easily</p>
    </header>

    <nav>
    <a href="index.html">Home</a>
    <a href="login.html" id="loginLink">Login</a>
    <a href="register.html">Register</a>
    <span id="userInfo"></span>
    <button type="button" id="logoutButton" hidden>Logout</button>
</nav>


    <main>
        <section class="card">
            <h2>Add Student</h2>

            <form id="studentForm">
                <input type="text" id="name"
                    placeholder="Student name" required>

                <input type="text" id="roll"
                    placeholder="Roll number" required>

                <input type="email" id="email"
                    placeholder="Email address" required>

                <button type="submit">Add Student</button>
            </form>
        </section>

        <section class="card">
            <h2>Student Records</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Email</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentList"></tbody>
            </table>

            <p id="emptyMessage">No students added yet.</p>
        </section>
    </main>

    <footer>
        <p>Student Management System | WAD Project</p>
    </footer>

    <script>
        const logoutButton = document.getElementById("logoutButton");
        const loggedInUser = JSON.parse(
    sessionStorage.getItem("loggedInUser") || "null"
);

const loginLink = document.getElementById("loginLink");
const userInfo = document.getElementById("userInfo");

if (loggedInUser) {
    loginLink.hidden = true;
    userInfo.textContent = "Welcome, " + loggedInUser.name + "!";
    logoutButton.hidden=false;
}else{
    logoutButton.hidden=true
    userinfo.style.color = "white";
}
logoutButton.addEventListener("click", function() {
    sessionStorage.removeItem("loggedInUser");
    window.location.href = "login.html";
});
        const form = document.getElementById("studentForm");
        const studentList = document.getElementById("studentList");
        const emptyMessage = document.getElementById("emptyMessage");

        // Load previously saved student records.
        let students = JSON.parse(
            localStorage.getItem("students") || "[]"
        );

        // Save student records in the browser.
        function saveStudents() {
            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );
        }

        function displayStudents() {
            studentList.innerHTML = "";

            students.forEach((student, index) => {
                const row = document.createElement("tr");

                [student.name, student.roll, student.email]
                    .forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                const actionCell = document.createElement("td");
                const deleteButton = document.createElement("button");

                deleteButton.textContent = "Delete";
                deleteButton.className = "delete";

                deleteButton.addEventListener("click", () => {
                    students.splice(index, 1);
                    saveStudents();
                    displayStudents();
                });

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);
                studentList.appendChild(row);
            });

            emptyMessage.hidden = students.length > 0;
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const roll = document.getElementById("roll").value.trim();
            const email = document.getElementById("email").value.trim();

            if (students.some(student =>
                student.roll.toLowerCase() === roll.toLowerCase()
            )) {
                alert("This roll number already exists.");
                return;
            }

            students.push({ name, roll, email });

            // Save immediately after adding a student.
            saveStudents();

            form.reset();
            displayStudents();
        });

        // Display saved records when the page opens.
        displayStudents();
    </script>

</body>
</html>
